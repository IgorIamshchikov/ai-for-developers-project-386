name: Release

on:
  push:
    branches: [ develop ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # develop is the default branch of this repository
          target-branch: develop
          release-type: simple
