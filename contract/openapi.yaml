openapi: 3.0.0
info:
  title: Календарь звонков
  description: |-
    Контракт сервиса записи на звонки.

    Источник решений: карта «Спецификация бронирования» (issue #18),
    тикеты «Сущности контракта» (#19), «Модель слотов и правила занятости» (#20)
    и «Форма API и админская часть» (#21).
  version: 0.0.0
tags: []
paths:
  /api/bookings:
    post:
      operationId: CalendarApi_createBooking
      description: Создание бронирования гостем; гонка на один слот — 409.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Неизвестный `eventTypeId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Слот занят — гонка двух бронирований на одно время.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotTakenError'
        '422':
          description: 'Невалидный запрос: пустые поля, некорректный email, `startsAt` не на границе сетки/в прошлом/вне окна.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
    get:
      operationId: CalendarApi_listBookings
      description: Предстоящие встречи владельца, одним списком по возрастанию `startsAt`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
  /api/event-types:
    get:
      operationId: CalendarApi_listEventTypes
      description: Список типов событий по алфавиту `title` (гость и владелец).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
    post:
      operationId: CalendarApi_createEventType
      description: Создание типа события владельцем.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '422':
          description: 'Невалидный запрос: пустые поля, некорректный email, `startsAt` не на границе сетки/в прошлом/вне окна.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeCreate'
  /api/event-types/{id}/slots:
    get:
      operationId: CalendarApi_listSlots
      description: Свободные слоты типа события в окне 14 дней, по возрастанию `startsAt`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: Неизвестный `eventTypeId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      description: 'Единая форма ошибки: `{ error: { code, message } }`.'
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - startsAt
        - visitorName
        - visitorEmail
      properties:
        id:
          type: string
          format: uuid
        eventTypeId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        visitorName:
          type: string
          minLength: 1
        visitorEmail:
          type: string
          format: email
      description: 'Бронирование: занятие посетителем свободного слота.'
    BookingCreate:
      type: object
      required:
        - eventTypeId
        - startsAt
        - visitorName
        - visitorEmail
      properties:
        eventTypeId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        visitorName:
          type: string
          minLength: 1
        visitorEmail:
          type: string
          format: email
      description: Данные для создания бронирования — посетитель не передаёт `id`.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
      description: 'Тип события: категория звонка в календаре владельца.'
    EventTypeCreate:
      type: object
      required:
        - title
        - description
        - durationMinutes
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
      description: Данные для создания типа события — владелец не передаёт `id`.
    NotFoundError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - not_found
            message:
              type: string
          required:
            - code
            - message
      description: Неизвестный `eventTypeId`.
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      description: |-
        Свободный интервал сетки — вычисляемое представление, не сущность:
        без `id`, конец выводится из длительности выбранного типа события.
    SlotTakenError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - slot_taken
            message:
              type: string
          required:
            - code
            - message
      description: Слот занят — гонка двух бронирований на одно время.
    ValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - validation
            message:
              type: string
          required:
            - code
            - message
      description: 'Невалидный запрос: пустые поля, некорректный email, `startsAt` не на границе сетки/в прошлом/вне окна.'
