services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # postgres:18 wants the volume at /var/lib/postgresql so that data
      # lands in a major-version subdirectory (see docker-library/postgres#37)
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: node:26-alpine
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # named volume keeps node_modules across compose runs/restarts,
      # so the host copy of frontend/ stays without it
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Сквозной тест в настоящем браузере против frontend+web+db (issue про
  # отзыв наставника: компонентные тесты мокают SDK и не проверяют связку
  # UI+сервер). Не стартует с `docker compose up -d` (профиль e2e) — запуск:
  # `docker compose up -d && docker compose run --rm e2e npm run test:e2e`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    working_dir: /app
    environment:
      BASE_URL: http://frontend:5173
    volumes:
      - ./frontend:/app
      - e2e_node_modules:/app/node_modules
    command: bash -c "npm ci && npm run test:e2e"
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # One-shot generation: TypeSpec -> OpenAPI -> client SDK. Mounts the repo
  # root (not just contract/) because the SDK output lands in frontend/src/api.
  contract:
    image: node:26-alpine
    working_dir: /repo/contract
    volumes:
      - .:/repo
      - contract_node_modules:/repo/contract/node_modules

volumes:
  db_data:
  frontend_node_modules:
  contract_node_modules:
  e2e_node_modules:
